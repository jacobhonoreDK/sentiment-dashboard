name: Options scanner (hourly)

on:
  schedule:
    - cron: '15 * * * *'  # Every hour at :15, between the sentiment runs
  workflow_dispatch:      # Can be run manually from GitHub
  pull_request:           # Test run on PRs: scans, but never commits or deploys
    paths:
      - 'options-scanner/**'
      - '.github/workflows/options-scanner.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: options-scanner-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scan
        run: python options-scanner/scan.py

      - name: Upload scan result (PR test run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: options-scanner/data.js

      - name: Commit data.js and cache
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options-scanner/data.js options-scanner/cache.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: options scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scan
    if: github.event_name != 'pull_request' && needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
