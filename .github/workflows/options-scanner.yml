name: Options scanner (hourly)

on:
  schedule:
    - cron: '15 * * * *'  # Every hour at :15, between the sentiment runs. GitHub often skips these,
                          # so during market hours each run also starts the next one (job "next").
  workflow_dispatch:      # Can be run manually from GitHub
  pull_request:           # Test run on PRs: scans, but never commits or deploys
    paths:
      - 'options-scanner/**'
      - '.github/workflows/options-scanner.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write   # lets a run start the next one (job "next")

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency:
      group: options-scanner-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run scan
        run: python options-scanner/scan.py

      - name: Upload scan result (PR test run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scan-result
          path: options-scanner/data.js

      - name: Commit data.js and cache
        id: commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options-scanner/data.js options-scanner/cache.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "auto: options scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scan
    if: github.event_name != 'pull_request' && needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  next:
    # GitHub runs scheduled workflows late or not at all (in practice every 4-5 hours), so
    # during market hours each run waits for the next :15 and starts the next scan itself.
    needs: [scan, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for the next :15 and start the next scan
        run: |
          sleep 30
          # If another run is already active, it starts the next scan; don't start a second chain.
          others=$(gh run list --workflow options-scanner.yml --branch main --limit 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .status != "completed")] | length')
          if [ "$others" != "0" ]; then echo "Another scanner run is active; it will start the next scan."; exit 0; fi
          now=$(date -u +%s)
          next=$(( (now - 900) / 3600 * 3600 + 3600 + 900 ))
          if [ $(( next - now )) -lt 600 ]; then next=$(( next + 3600 )); fi
          dow=$(TZ=America/New_York date -d @$next +%u)
          hm=$(( 10#$(TZ=America/New_York date -d @$next +%H%M) ))
          if [ "$dow" -gt 5 ] || [ "$hm" -lt 915 ] || [ "$hm" -gt 1615 ]; then
            echo "Next slot $(TZ=America/New_York date -d @$next '+%a %H:%M %Z') is outside market hours; the hourly schedule covers it."
            exit 0
          fi
          echo "Next scan at $(TZ=America/New_York date -d @$next '+%a %H:%M %Z')"
          sleep $(( next - now ))
          gh workflow run options-scanner.yml --ref main
